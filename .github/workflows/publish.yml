name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      # version: changesets are pending, so open or update the "Version Packages" pull request.
      # publish: none are pending and the package.json version has no tag yet, which is what
      #          merging that pull request leaves behind.
      # none:    nothing to do.
      - name: Choose what this push calls for
        id: plan
        run: |
          VERSION="$(node --print 'require("./package.json").version')"
          if [ -n "$(find .changeset -name '*.md' ! -name README.md)" ]; then
            MODE=version
          elif [ -z "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            MODE=publish
          else
            MODE=none
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Mode for $VERSION: \`$MODE\`" >> "$GITHUB_STEP_SUMMARY"

  version:
    name: Open version pull request
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      # To push the version commit and open the pull request for it
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/krypton
          cache: npm
      - run: npm ci
      - uses: changesets/action/version@v2
        with:
          script: npm run version-packages

  publish:
    name: Publish to npm
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    # Must match the environment configured on the npm trusted publisher
    environment: main
    permissions:
      # To create the GitHub release and its tag
      contents: write
      # Needed for npm to mint the OIDC token used for trusted publishing and provenance
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Bundles npm >= 11.15.0, needed for trusted publishing and "npm stage publish"
          node-version: lts/krypton
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Resolve release
        id: release
        run: |
          NAME="$(node --print 'require("./package.json").name')"
          VERSION="$(node --print 'require("./package.json").version')"
          # Everything published here becomes the "latest" dist-tag, so refuse anything
          # pre-release shaped rather than quietly pointing "latest" at it.
          if [ "$VERSION" != "${VERSION%%-*}" ]; then
            echo "::error::Pre-releases are not supported - $VERSION would still become the latest version"
            exit 1
          fi
          if npm view "$NAME@$VERSION" version --silent > /dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published - it is missing its v$VERSION tag"
            exit 1
          fi
          {
            echo "name=$NAME"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
      # The tag is what marks this version as handled, so later pushes to main skip it. It comes
      # before staging so that a failed stage can be retried by re-running this job, which skips
      # this step the second time around.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            exit 0
          fi
          # The newest section of the changelog, minus its heading
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
      # No NODE_AUTH_TOKEN: the npm CLI detects the OIDC environment and exchanges the token
      # itself. Provenance is generated automatically when publishing via OIDC, but passing
      # --provenance makes it explicit (and fails the job loudly if it ever cannot be generated).
      # Staging leaves the release uninstallable until a maintainer approves it with 2FA.
      # No --tag: the default "latest" is the only channel this package publishes to.
      - name: Stage publish
        run: npm stage publish --provenance
      - name: Summarize
        env:
          NAME: ${{ steps.release.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "### Staged \`$NAME@$VERSION\` :package:"
            echo
            echo "It is not installable yet. Approve it with 2FA to promote it to the registry:"
            echo
            echo '```sh'
            echo "npm stage list $NAME"
            echo "npm stage view <stage-id> # or: npm stage download <stage-id>"
            echo "npm stage approve <stage-id> # or: npm stage reject <stage-id>"
            echo '```'
            echo
            echo "The stage queue is also available on <https://www.npmjs.com/package/$NAME>."
          } >> "$GITHUB_STEP_SUMMARY"
