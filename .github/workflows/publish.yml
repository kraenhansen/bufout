name: Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Stage the release for manual approval, or publish it right away
        type: choice
        options:
          - stage
          - publish
        default: stage
      dist_tag:
        description: The npm dist-tag to publish under
        type: string
        default: latest

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Must match the environment configured on the npm trusted publisher
    environment: main
    permissions:
      contents: read
      # Needed for npm to mint the OIDC token used for trusted publishing and provenance
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/krypton
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 and staged publishing needs npm >= 11.15.0,
      # which is newer than what Node ships with today.
      - name: Update npm
        run: npm install --global npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Read package name and version
        id: package
        run: |
          {
            echo "name=$(node --print 'require("./package.json").name')"
            echo "version=$(node --print 'require("./package.json").version')"
          } >> "$GITHUB_OUTPUT"
      - name: Assert version is not already published
        env:
          SPEC: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        run: |
          if npm view "$SPEC" version --silent > /dev/null 2>&1; then
            echo "::error::$SPEC is already published - bump the version in package.json first"
            exit 1
          fi
      # No NODE_AUTH_TOKEN: the npm CLI detects the OIDC environment and exchanges the token
      # itself. Provenance is generated automatically when publishing via OIDC, but passing
      # --provenance makes it explicit (and fails the job loudly if it ever cannot be generated).
      - name: Stage publish
        if: inputs.mode == 'stage'
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm stage publish --provenance --tag "$DIST_TAG"
      - name: Publish
        if: inputs.mode == 'publish'
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish --provenance --tag "$DIST_TAG"
      - name: Summarize
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "stage" ]; then
            {
              echo "### Staged \`$NAME@$VERSION\` (\`$DIST_TAG\`) :package:"
              echo
              echo "It is not installable yet. Approve it with 2FA to promote it to the registry:"
              echo
              echo '```sh'
              echo "npm stage list $NAME"
              echo "npm stage view <stage-id> # or: npm stage download <stage-id>"
              echo "npm stage approve <stage-id> # or: npm stage reject <stage-id>"
              echo '```'
              echo
              echo "The stage queue is also available on <https://www.npmjs.com/package/$NAME>."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published \`$NAME@$VERSION\` (\`$DIST_TAG\`) :rocket:" >> "$GITHUB_STEP_SUMMARY"
          fi
